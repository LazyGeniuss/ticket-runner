[project]
name = "workflow-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shreyash-lgtm", email = "shreyash@appraisalbureau.com" }
]
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.159",
    "python-dotenv>=1.2.3",
]

[project.scripts]
workflow-test = "workflow_test:main"
solve-tickets = "workflow_test.solve_tickets:main"
agent = "workflow_test.agent:main"
tickets = "workflow_test.fetch_tickets:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
